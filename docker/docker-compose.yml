version: '3.8'

# ============================================================
# WATT-SN — Infrastructure Big Data complète
# Équipe 06 | Master 2 DSGL | UADB Bambey 2025-2026
# ============================================================

networks:
  watt_network:
    driver: bridge

volumes:
  zookeeper_data:
  kafka_data:
  nifi_data:
  nifi_logs:
  hbase_data:
  hive_data:
  airflow_db:

services:

  # ─────────────────────────────────────────────────────────
  # 1. ZOOKEEPER — Coordinateur Kafka
  # ─────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: watt_zookeeper
    hostname: zookeeper
    networks:
      - watt_network
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # 2. KAFKA — Broker de messages
  # Topics : watt_conso_raw, watt_solaire_raw, watt_alerts
  # ─────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: watt_kafka
    hostname: kafka
    networks:
      - watt_network
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # 3. KAFKA INIT — Création automatique des topics
  # ─────────────────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: watt_kafka_init
    networks:
      - watt_network
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c", "sleep 10 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic watt_conso_raw --partitions 3 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic watt_solaire_raw --partitions 3 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic watt_alerts --partitions 1 --replication-factor 1 && echo 'Topics créés !' && kafka-topics --bootstrap-server kafka:29092 --list"]
    restart: on-failure

  # ─────────────────────────────────────────────────────────
  # 4. KAFKA UI — Interface web pour visualiser les topics
  # Accès : http://localhost:8085
  # ─────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: watt_kafka_ui
    networks:
      - watt_network
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: watt-sn
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # 5. APACHE NIFI — Ingestion multi-sources
  # Accès : http://localhost:8081/nifi
  # ─────────────────────────────────────────────────────────
  nifi:
    image: apache/nifi:1.23.2
    container_name: watt_nifi
    hostname: nifi
    networks:
      - watt_network
    ports:
      - "8081:8080"
    volumes:
      - nifi_data:/opt/nifi/nifi-current/conf
      - nifi_logs:/opt/nifi/nifi-current/logs
      - ./nifi_templates:/opt/nifi/nifi-current/conf/templates
    environment:
      NIFI_WEB_HTTP_PORT: 8080
      NIFI_CLUSTER_IS_NODE: "false"
      NIFI_ZK_CONNECT_STRING: zookeeper:2181
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: adminpassword123
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/nifi/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # 6. HBASE — Stockage NoSQL temps réel des alertes
  # Accès : http://localhost:16010
  # ─────────────────────────────────────────────────────────
  hbase:
    image: dajobe/hbase:latest
    container_name: watt_hbase
    hostname: hbase
    networks:
      - watt_network
    ports:
      - "16000:16000"   # HBase Master
      - "16010:16010"   # HBase Master Web UI
      - "16020:16020"   # HBase RegionServer
      - "16030:16030"   # HBase RegionServer Web UI
      - "2182:2181"     # ZooKeeper HBase (port différent pour éviter conflit)
      - "8086:8085"     # HBase REST API (désactivé si conflit avec kafka-ui)
      - "9090:9090"     # HBase Thrift Server
    volumes:
      - hbase_data:/data
    environment:
      HBASE_CONF_hbase_rootdir: /data/hbase
      HBASE_CONF_hbase_zookeeper_quorum: localhost
      HBASE_CONF_hbase_zookeeper_property_clientPort: 2181
    healthcheck:
      test: ["CMD", "hbase", "status"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # 7. SPARK MASTER — Moteur de traitement streaming
  # Accès : http://localhost:8080
  # ─────────────────────────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.1
    container_name: watt_spark_master
    hostname: spark-master
    networks:
      - watt_network
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_NO_DAEMONIZE=true
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  # ─────────────────────────────────────────────────────────
  # 8. SPARK WORKER — Nœud de calcul
  # ─────────────────────────────────────────────────────────
  spark-worker:
    image: apache/spark:3.5.1
    container_name: watt_spark_worker
    hostname: spark-worker
    networks:
      - watt_network
    ports:
      - "8082:8081"
    environment:
      - SPARK_NO_DAEMONIZE=true
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # 9. HIVE METASTORE DB — Base PostgreSQL pour Hive
  # ─────────────────────────────────────────────────────────
  hive-metastore-db:
    image: postgres:14-alpine
    container_name: watt_hive_metastore_db
    hostname: hive-metastore-db
    networks:
      - watt_network
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive123
    volumes:
      - hive_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # 10. HIVE — Entrepôt de données analytique
  # Accès : thrift://hive:10000
  # ─────────────────────────────────────────────────────────
  hive:
    image: apache/hive:3.1.3
    container_name: watt_hive
    hostname: hive
    networks:
      - watt_network
    ports:
      - "10000:10000"   # HiveServer2
      - "10002:10002"   # HiveServer2 Web UI
    environment:
      SERVICE_NAME: hiveserver2
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive123
    depends_on:
      hive-metastore-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "beeline", "-u", "jdbc:hive2://localhost:10000", "-e", "show databases;"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # 11. AIRFLOW DB — Base PostgreSQL pour Airflow
  # ─────────────────────────────────────────────────────────
  airflow-db:
    image: postgres:14-alpine
    container_name: watt_airflow_db
    hostname: airflow-db
    networks:
      - watt_network
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow123
    volumes:
      - airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # 12. AIRFLOW INIT — Initialisation DB + création admin
  # ─────────────────────────────────────────────────────────
  airflow-init:
    image: apache/airflow:2.7.2
    container_name: watt_airflow_init
    networks:
      - watt_network
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    depends_on:
      airflow-db:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c", "airflow db migrate && airflow users create --username admin --password admin123 --firstname Admin --lastname WattSN --role Admin --email admin@watt-sn.sn && echo 'Airflow initialisé !'"]
    restart: on-failure

  # ─────────────────────────────────────────────────────────
  # 13. AIRFLOW WEBSERVER — Interface web DAGs
  # Accès : http://localhost:8083
  # ─────────────────────────────────────────────────────────
  airflow-webserver:
    image: apache/airflow:2.7.2
    container_name: watt_airflow_webserver
    hostname: airflow-webserver
    networks:
      - watt_network
    ports:
      - "8083:8080"
    volumes:
      - ./dags:/opt/airflow/dags
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: watt-sn-secret-key-2025
    depends_on:
      - airflow-init
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # 14. AIRFLOW SCHEDULER — Planificateur des DAGs
  # ─────────────────────────────────────────────────────────
  airflow-scheduler:
    image: apache/airflow:2.7.2
    container_name: watt_airflow_scheduler
    hostname: airflow-scheduler
    networks:
      - watt_network
    volumes:
      - ./dags:/opt/airflow/dags
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: watt-sn-secret-key-2025
    depends_on:
      - airflow-init
    command: scheduler
    restart: unless-stopped

# ============================================================
# RÉCAP DES PORTS & INTERFACES WEB
# ============================================================
# Service          | Port  | URL
# -----------------|-------|--------------------------------
# NiFi             | 8081  | http://localhost:8081/nifi
# Spark Master UI  | 8080  | http://localhost:8080
# Spark Worker UI  | 8082  | http://localhost:8082
# Airflow          | 8083  | http://localhost:8083
# Kafka UI         | 8085  | http://localhost:8085
# HBase Master UI  | 16010 | http://localhost:16010
# Kafka            | 9092  | localhost:9092
# ZooKeeper        | 2181  | localhost:2181
# HiveServer2      | 10000 | jdbc:hive2://localhost:10000
# ============================================================